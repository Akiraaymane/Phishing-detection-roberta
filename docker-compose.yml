services:
  # ========================================
  # ENTRAÎNEMENT SMS
  # ========================================
  train-sms:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    container_name: train-sms
    volumes:
      - ./:/app
    environment:
      - DOCKER_ENV=docker
    command: python src/training/train.py --data_type sms --data_path data/sms_spam.csv --output_dir models/roberta-sms --epochs 1 --batch_size 8

  # ========================================
  # TEST SMS
  # ========================================
  test-sms:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    container_name: test-sms
    volumes:
      - ./:/app
    environment:
      - DOCKER_ENV=docker
    command: python src/training/test.py --data_type sms --data_path data/sms_spam.csv --model_path models/roberta-sms
    depends_on:
      - train-sms

  # ========================================
  # ENTRAÎNEMENT EMAIL
  # ========================================
  train-email:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    container_name: train-email
    volumes:
      - ./:/app
    environment:
      - DOCKER_ENV=docker
    command: python src/training/train.py --data_type email --data_path data/email_dataset.csv --output_dir models/roberta-email --epochs 1 --batch_size 8
    depends_on:
      - train-sms

  # ========================================
  # TEST EMAIL
  # ========================================
  test-email:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    container_name: test-email
    volumes:
      - ./:/app
    environment:
      - DOCKER_ENV=docker
    command: python src/training/test.py --data_type email --data_path data/email_dataset.csv --model_path models/roberta-email
    depends_on:
      - train-email

  # ========================================
  # API
  # ========================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: phishing-api
    ports:
      - "8000:8000"
    volumes:
      - ./models/roberta-sms:/app/models/roberta-sms:ro
      - ./models/roberta-email:/app/models/roberta-email:ro
    depends_on:
      - train-sms
      - train-email
    restart: unless-stopped
